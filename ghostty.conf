# Archlinux theme for Ghostty (adapted from the Alacritty terminal config).
# Frosted glass window, wheat-white text, mint/peach palette.

# ── Primary ──────────────────────────────────────────────────
background = #1a1f2b
foreground = #f5f1e8

# Frosted glass: 0.80 opacity with compositor blur.
background-opacity = 0.80
background-blur = true

# ── Cursor ───────────────────────────────────────────────────
# Near-white cursor, always visible on the dark navy base.
cursor-color = #fafafa
cursor-text  = #1a1f2b

# ── Selection ────────────────────────────────────────────────
selection-background = #2c3547
selection-foreground = #f5f1e8

# ── Normal ANSI (0-7) ────────────────────────────────────────
palette = 0=#1a1f2b
palette = 1=#aaf1ff
palette = 2=#0397a4
palette = 3=#cbfff9
palette = 4=#e3e3e3
palette = 5=#abf6fd
palette = 6=#77e0f8
palette = 7=#ffffff

# ── Bright ANSI (8-15) ───────────────────────────────────────
palette = 8=#c8e1e4
palette = 9=#d9836f
palette = 10=#96b8a4
palette = 11=#ecc98c
palette = 12=#8ba5c4
palette = 13=#c29ebd
palette = 14=#85b7c0
palette = 15=#f5f1e8

# ── Extended (16+) ───────────────────────────────────────────
palette = 16=#e0916a
palette = 17=#8a6a52